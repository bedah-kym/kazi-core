<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kazi grouped chats on a phone, move to group</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
button{font:inherit;cursor:pointer}
a{color:#8a3016}a:hover{color:#6f2611}
.brick{background-image:url("Backend/chatbot/static/img/brick-wall.svg");background-size:96px 48px}
</style>
</helmet>
<div class="brick" style="position: relative; width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; font-family: Inter, system-ui, sans-serif; font-size: 15px; line-height: 1.5; color: #3d3929; background-color: #fcfbf8; overflow: hidden">

  <header style="flex: none; display: flex; align-items: center; justify-content: space-between; padding: 16px 16px 8px">
    <h1 style="margin: 0; font-size: 24px; font-weight: 700; letter-spacing: -0.02em">Chats</h1>
    <button aria-label="New chat" style="width: 44px; height: 44px; border: 0; border-radius: 50%; background: rgba(168,60,30,.12); color: #8a3016; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
  </header>

  <main style="flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; gap: 6px; padding: 4px 12px; overflow: hidden">
    <div style="font-size: 11px; font-weight: 600; letter-spacing: .1em; color: #6e6a5e; padding: 4px 6px 0">NEEDS YOU</div>
    <div style="display: flex; align-items: flex-start; gap: 12px; padding: 10px 12px; border-radius: 14px; background: #fff; border: 1px solid #e5e0d5">
      <span style="width: 40px; height: 40px; flex: none; border-radius: 50%; background: #a83c1e; color: #fff; font-weight: 600; display: flex; align-items: center; justify-content: center">K</span>
      <span style="display: flex; flex-direction: column; min-width: 0; flex-grow: 1">
        <span style="display: flex; justify-content: space-between; gap: 8px"><span style="font-weight: 600">General</span><span style="font-size: 12px; color: #6e6a5e">Now</span></span>
        <span style="font-size: 13px; color: #57513f; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Follow-up email to Amina is ready to send</span>
      </span>
    </div>

    <div style="display: flex; align-items: center; gap: 8px; height: 40px; flex: none; padding: 0 14px; margin-top: 4px; border-radius: 999px; background: #5f6b3a; color: #fff; font-size: 14px; font-weight: 600">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      <span style="flex-grow: 1">School project</span><span style="font-weight: 500; opacity: .85">4</span>
    </div>
    <div style="display: flex; align-items: flex-start; gap: 12px; padding: 10px 12px; margin-left: 8px; border-left: 3px solid #5f6b3a; border-radius: 0 14px 14px 0; background: #fff">
      <span style="width: 40px; height: 40px; flex: none; border-radius: 50%; background: #e7ead9; color: #4a5630; font-weight: 600; display: flex; align-items: center; justify-content: center">W</span>
      <span style="display: flex; flex-direction: column; min-width: 0; flex-grow: 1">
        <span style="display: flex; justify-content: space-between; gap: 8px"><span style="font-weight: 600">Essay draft</span><span style="font-size: 12px; color: #6e6a5e">4:12 PM</span></span>
        <span style="font-size: 13px; color: #57513f; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Second draft of the introduction</span>
      </span>
    </div>
    <div style="display: flex; align-items: flex-start; gap: 12px; padding: 10px 12px; margin-left: 8px; border-left: 3px solid #5f6b3a; border-radius: 0 14px 14px 0; background: #fff">
      <span style="width: 40px; height: 40px; flex: none; border-radius: 50%; background: #e7ead9; color: #4a5630; font-weight: 600; display: flex; align-items: center; justify-content: center">R</span>
      <span style="display: flex; flex-direction: column; min-width: 0; flex-grow: 1">
        <span style="display: flex; justify-content: space-between; gap: 8px"><span style="font-weight: 600">Research notes</span><span style="font-size: 12px; color: #6e6a5e">2:30 PM</span></span>
        <span style="font-size: 13px; color: #57513f; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Six sources summarised, two still to read</span>
      </span>
    </div>
  </main>

  <!-- Backdrop and sheet: long-press on a chat opens this -->
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(38,38,36,.45)"></div>

  <div role="dialog" aria-modal="true" aria-labelledby="sheet-title" style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; background: #fcfbf8; border-radius: 20px 20px 0 0; padding: 8px 12px 20px; display: flex; flex-direction: column; gap: 4px; box-shadow: 0 -8px 32px rgba(38,38,36,.3)">
    <span aria-hidden="true" style="align-self: center; width: 40px; height: 4px; border-radius: 999px; background: #cfc8b8; margin-bottom: 8px"></span>
    <div style="display: flex; align-items: center; gap: 12px; padding: 0 8px 10px; border-bottom: 1px solid #e5e0d5">
      <span style="width: 40px; height: 40px; flex: none; border-radius: 50%; background: #e9e4d8; color: #57513f; font-weight: 600; display: flex; align-items: center; justify-content: center">S</span>
      <div style="display: flex; flex-direction: column; min-width: 0">
        <h2 id="sheet-title" style="margin: 0; font-size: 16px; font-weight: 600">Sources and citations</h2>
        <span style="font-size: 13px; color: #6e6a5e">Not in a group</span>
      </div>
    </div>

    <div style="font-size: 11px; font-weight: 600; letter-spacing: .1em; color: #6e6a5e; padding: 10px 8px 2px">MOVE TO GROUP</div>
    <button style="display: flex; align-items: center; gap: 12px; height: 52px; padding: 0 8px; border: 0; border-radius: 12px; background: rgba(95,107,58,.12); color: #3d3929; font-size: 16px; text-align: left">
      <span aria-hidden="true" style="width: 16px; height: 16px; border-radius: 50%; background: #5f6b3a"></span>
      <span style="flex-grow: 1; font-weight: 600">School project</span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4a5630" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>
    </button>
    <button style="display: flex; align-items: center; gap: 12px; height: 52px; padding: 0 8px; border: 0; border-radius: 12px; background: transparent; color: #3d3929; font-size: 16px; text-align: left">
      <span aria-hidden="true" style="width: 16px; height: 16px; border-radius: 50%; background: #8a5e10"></span>
      <span style="flex-grow: 1">Client work</span>
    </button>
    <button style="display: flex; align-items: center; gap: 12px; height: 52px; padding: 0 8px; border: 0; border-radius: 12px; background: transparent; color: #8a3016; font-size: 16px; font-weight: 600; text-align: left">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      <span style="flex-grow: 1">New group</span>
    </button>

    <div style="height: 1px; background: #e5e0d5; margin: 4px 0"></div>
    <button style="display: flex; align-items: center; gap: 12px; height: 52px; padding: 0 8px; border: 0; border-radius: 12px; background: transparent; color: #3d3929; font-size: 16px; text-align: left">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 17v4M8 4h8l-1 6 3 4H6l3-4z"/></svg>
      <span style="flex-grow: 1">Pin to top</span>
    </button>
    <button style="display: flex; align-items: center; gap: 12px; height: 52px; padding: 0 8px; border: 0; border-radius: 12px; background: transparent; color: #3d3929; font-size: 16px; text-align: left">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16zM13 7l4 4"/></svg>
      <span style="flex-grow: 1">Edit name and description</span>
    </button>
    <button style="display: flex; align-items: center; gap: 12px; height: 52px; padding: 0 8px; border: 0; border-radius: 12px; background: transparent; color: #3d3929; font-size: 16px; text-align: left">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h18v4H3zM5 9v10h14V9M10 13h4"/></svg>
      <span style="flex-grow: 1">Archive</span>
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
