name: CI

permissions:
  contents: read

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: kazi_user
          POSTGRES_PASSWORD: kazi_password
          POSTGRES_DB: kazi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kazi_user -d kazi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://kazi_user:kazi_password@localhost:5432/kazi_test
      DJANGO_SECRET_KEY: ci-test-key-not-for-prod
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 bandit coverage

      - name: Lint (flake8)
        run: |
          flake8 Backend --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 Backend --count --max-complexity=10 --max-line-length=127 --statistics

      - name: Security scan (Bandit)
        run: bandit -r Backend --skip B101

      - name: Django system checks
        run: python Backend/manage.py check

      - name: Run tests with coverage
        run: |
          coverage run --source=Backend --omit='*/migrations/*,*/tests/*,*/test_*.py' \
            Backend/manage.py test --noinput --verbosity=2
          coverage xml -o coverage.xml
          coverage report --skip-covered --fail-under=0

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: backend
          fail_ci_if_error: false
          verbose: false
