name: CI

permissions:
  contents: read

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: kazi_user
          POSTGRES_PASSWORD: kazi_password
          POSTGRES_DB: kazi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kazi_user -d kazi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://kazi_user:kazi_password@localhost:5432/kazi_test
      DJANGO_SECRET_KEY: ci-test-key-not-for-prod
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 bandit coverage

      # v0.4 M6-1 phase 1: critical set now includes the real-bug rules
      # E712 (== True), E722 (bare except), E731 (lambda assign), in addition
      # to the existing E9 (syntax) / F63 / F7 / F82 / F811 / F202 set.
      # All seven blocking rules are now clean across Backend/.
      - name: Lint - critical correctness (must pass)
        run: |
          flake8 Backend --count --select=E9,F63,F7,F82,F811,F202,E712,E722,E731 --show-source --statistics

      # v0.4 M6-1 phase 1: ~80% reduction in advisory findings (autopep8 sweep
      # for whitespace / tabs / blank lines / inline-comment spacing). The
      # remaining ~487 findings are mostly E501 long lines, F401 unused
      # imports, F841 unused locals, and complexity (C901) — these need
      # per-file judgement and land as v0.5 cleanups before this job flips
      # to blocking.
      - name: Lint - full PEP 8 (advisory until v0.5 cleanup completes)
        continue-on-error: true
        run: |
          flake8 Backend --count --statistics

      - name: Security scan - high severity (must pass)
        run: bandit -r Backend --skip B101 -lll

      - name: Security scan - medium+low (advisory until v0.4 cleanup)
        continue-on-error: true
        run: bandit -r Backend --skip B101

      - name: Django system checks
        run: python Backend/manage.py check

      - name: Run tests with coverage
        run: |
          coverage run --source=Backend --omit='*/migrations/*,*/tests/*,*/test_*.py' \
            Backend/manage.py test --noinput --verbosity=2
          coverage xml -o coverage.xml
          coverage report --skip-covered --fail-under=0

      # v0.4 M4-1: smoke-test the golden-scenario harness on every PR.
      # No --allow-llm so this works without ANTHROPIC_API_KEY; the harness
      # skips LLM-backed scenarios and still proves the wiring is healthy.
      # Add ANTHROPIC_API_KEY as a repo secret + --allow-llm once enough
      # scenarios accumulate to warrant the spend; flip continue-on-error
      # to false when planner-regression coverage matures. See docs/eval.md.
      - name: Eval - golden scenarios (advisory until coverage matures)
        continue-on-error: true
        run: python Backend/manage.py run_golden_eval

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: backend
          fail_ci_if_error: false
          verbose: false
