<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kazi voice, review before sending</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
button{font:inherit;cursor:pointer}
a{color:#8a3016}a:hover{color:#6f2611}
.brick{background-image:url("Backend/chatbot/static/img/brick-wall.svg");background-size:96px 48px}
</style>
</helmet>
<main class="brick" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; font-family: Inter, system-ui, sans-serif; font-size: 15px; line-height: 1.5; color: #3d3929; background-color: #f6f3ec; overflow: hidden">

  <header style="height: 60px; flex: none; box-sizing: border-box; display: flex; align-items: center; gap: 10px; padding: 0 12px; background: rgba(252,251,248,.92); border-bottom: 1px solid #e5e0d5">
    <span style="width: 36px; height: 36px; flex: none; border-radius: 50%; background: #a83c1e; color: #fff; font-weight: 600; display: flex; align-items: center; justify-content: center">K</span>
    <div style="display: flex; flex-direction: column; flex-grow: 1; min-width: 0">
      <h1 style="margin: 0; font-size: 16px; font-weight: 600">General</h1>
      <span style="font-size: 12px; color: #2f6b4a">Kazi is ready</span>
    </div>
  </header>

  <div style="flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; justify-content: flex-end; gap: 12px; padding: 16px 12px; overflow: hidden">
    <div style="align-self: flex-start; max-width: 86%; padding: 12px 16px; border-radius: 16px 16px 16px 5px; background: #fcfbf8; border: 1px solid rgba(168,60,30,.25)">The March invoice went to Amina on the 4th. Anything else?</div>
  </div>

  <!-- What you said, as text you can fix before it goes -->
  <div style="flex: none; padding: 0 10px 14px">
    <div style="display: flex; flex-direction: column; gap: 10px; padding: 12px; border-radius: 24px; background: #fcfbf8; border: 1px solid #e5e0d5; box-shadow: 0 6px 20px rgba(61,57,41,.12)">
      <div style="display: flex; align-items: center; gap: 8px">
        <button aria-label="Play what you said" style="width: 40px; height: 40px; flex: none; border: 0; border-radius: 50%; background: rgba(168,60,30,.12); color: #8a3016; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5l12 7-12 7z"/></svg></button>
        <span style="font-size: 13px; color: #57513f; flex-grow: 1">You said <span style="font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px">0:06</span></span>
        <button aria-label="Discard" style="width: 40px; height: 40px; flex: none; border: 0; border-radius: 50%; background: transparent; color: #57513f; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>

      <label style="display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 11px; font-weight: 600; letter-spacing: .1em; color: #6e6a5e">YOUR MESSAGE · TAP TO EDIT</span>
        <textarea rows="3" style="resize: none; box-sizing: border-box; width: 100%; padding: 10px 12px; border: 1px solid #cfc8b8; border-radius: 12px; background: #fff; font: inherit; font-size: 16px; color: #3d3929">Remind me on Friday to check if she has paid.</textarea>
      </label>

      <div style="display: flex; gap: 8px">
        <button style="flex: 1 1 0; height: 48px; border: 1px solid #e5e0d5; border-radius: 999px; background: #fff; color: #3d3929; font-weight: 500; font-size: 14px">Send as voice note</button>
        <button style="flex: 1 1 0; height: 48px; border: 0; border-radius: 999px; background: #a83c1e; color: #fff; font-weight: 600; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 4px 12px rgba(168,60,30,.3)">Send to Kazi
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 11.5l18-8-7 18-3-7z"/></svg>
        </button>
      </div>

      <label style="display: flex; align-items: center; gap: 10px; font-size: 13px; color: #57513f; min-height: 32px">
        <input type="checkbox" style="width: 20px; height: 20px; accent-color: #a83c1e">
        Hands-free: send automatically when I stop talking
      </label>
    </div>
  </div>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
