{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signed out - Mathia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="{% static 'favicon.ico' %}">
    <style>
        :root {
            --bg: #ffffff;
            --text: #37352f;
            --muted: rgba(55, 53, 47, 0.65);
            --border: #e9e9e7;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            padding: 24px;
        }
        .card {
            max-width: 420px;
            width: 100%;
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 36px 32px;
            text-align: center;
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.05);
        }
        .mark {
            width: 52px;
            height: 52px;
            margin: 0 auto 18px;
            border-radius: 14px;
            background: #000;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        h1 {
            font-size: 22px;
            margin: 0 0 6px;
        }
        p {
            color: var(--muted);
            margin: 0 0 24px;
            font-size: 14px;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 44px;
            padding: 0 18px;
            border-radius: 10px;
            background: #000;
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
        }
        .btn:hover { background: #333; }
        .btn:focus-visible {
            outline: 2px solid #000;
            outline-offset: 2px;
        }
    </style>
</head>
<body>
    <main class="card">
        <div class="mark"><i class="fas fa-sign-out-alt"></i></div>
        <h1>You've been signed out</h1>
        <p>Thanks for stopping by. Sign back in whenever you're ready.</p>
        <a class="btn" href="{% url 'users:login' %}">
            <i class="fas fa-arrow-right-to-bracket"></i> Sign in again
        </a>
    </main>
</body>
</html>
