<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kazi voice, recording on a phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
button{font:inherit;cursor:pointer}
a{color:#8a3016}a:hover{color:#6f2611}
.brick{background-image:url("Backend/chatbot/static/img/brick-wall.svg");background-size:96px 48px}
</style>
</helmet>
<main class="brick" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; font-family: Inter, system-ui, sans-serif; font-size: 15px; line-height: 1.5; color: #3d3929; background-color: #f6f3ec; overflow: hidden">

  <header style="height: 60px; flex: none; box-sizing: border-box; display: flex; align-items: center; gap: 10px; padding: 0 12px; background: rgba(252,251,248,.92); border-bottom: 1px solid #e5e0d5">
    <span style="width: 36px; height: 36px; flex: none; border-radius: 50%; background: #a83c1e; color: #fff; font-weight: 600; display: flex; align-items: center; justify-content: center">K</span>
    <div style="display: flex; flex-direction: column; flex-grow: 1; min-width: 0">
      <h1 style="margin: 0; font-size: 16px; font-weight: 600">General</h1>
      <span style="font-size: 12px; color: #8a3016; font-weight: 600">Listening</span>
    </div>
  </header>

  <div style="flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; justify-content: flex-end; gap: 12px; padding: 16px 12px; overflow: hidden">
    <div style="align-self: flex-start; max-width: 86%; padding: 12px 16px; border-radius: 16px 16px 16px 5px; background: #fcfbf8; border: 1px solid rgba(168,60,30,.25)">The March invoice went to Amina on the 4th. Anything else?</div>

    <!-- Live words as they are heard -->
    <div aria-live="polite" style="align-self: flex-end; max-width: 86%; padding: 12px 16px; border-radius: 16px 16px 5px 16px; background: rgba(74,70,60,.1); border: 1px dashed #57513f; color: #3d3929">
      <span style="font-size: 11px; font-weight: 600; letter-spacing: .1em; color: #57513f; display: block">HEARING</span>
      Remind me on Friday to check if she has <span style="color: #6e6a5e">paid…</span>
    </div>
  </div>

  <div style="flex: none; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 0 10px 14px">
    <span style="font-size: 12px; color: #57513f; background: rgba(252,251,248,.92); border-radius: 999px; padding: 2px 12px">Release to finish · slide left to cancel · slide up to lock</span>

    <!-- The recording bar takes the composer's place; nothing covers it -->
    <div role="group" aria-label="Recording" style="width: 100%; box-sizing: border-box; display: flex; align-items: center; gap: 8px; min-height: 64px; padding: 8px; border-radius: 32px; background: #fcfbf8; border: 2px solid #a83c1e; box-shadow: 0 6px 20px rgba(168,60,30,.22)">
      <button aria-label="Cancel recording" style="width: 48px; height: 48px; flex: none; border: 1px solid #e5e0d5; border-radius: 50%; background: #fff; color: #57513f; display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <div role="img" aria-label="Sound level" style="flex-grow: 1; min-width: 0; height: 36px; display: flex; align-items: center; justify-content: center; gap: 3px; overflow: hidden">
        <sc-for list="{{bars}}" as="b" hint-placeholder-count="30"><span style="{{b}}"></span></sc-for>
      </div>
      <span role="timer" style="font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14px; font-weight: 600; color: #8a3016; flex: none">0:06</span>
      <button aria-label="Finish and review" style="width: 48px; height: 48px; flex: none; border: 0; border-radius: 50%; background: #a83c1e; color: #fff; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(168,60,30,.35)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>
      </button>
    </div>
  </div>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var hs = [8, 14, 22, 30, 18, 10, 26, 34, 20, 12, 28, 16, 8, 24, 32, 18, 10, 22, 30, 14, 8, 20, 28, 12, 6, 6, 6, 6, 6, 6];
return { bars: hs.map(function (h, i) { return 'width:3px;flex:none;border-radius:2px;height:' + h + 'px;background:' + (i < 24 ? '#a83c1e' : '#cfc8b8') + ';'; }) };
}
}
</script>
</body>
</html>
