<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kazi dark mode, sign in</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
button{font:inherit;cursor:pointer}
a{color:#f6a685}a:hover{color:#f8bfa6}
.brick{background-image:url("Backend/chatbot/static/img/brick-wall-dark.svg");background-size:96px 48px}
</style>
</helmet>
<main class="brick" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; gap: 24px; padding: 40px 16px 24px; font-family: Inter, system-ui, sans-serif; font-size: 15px; line-height: 1.5; color: #edeae2; background-color: #262624; overflow: hidden">

  <div style="display: flex; align-items: center; gap: 12px; padding: 0 8px">
    <span style="width: 40px; height: 40px; border-radius: 12px; background: #a83c1e; display: flex; align-items: center; justify-content: center"><svg viewBox="5 3 23 26" width="20" height="20" aria-hidden="true"><polygon fill="#fff" points="5,3 11,3 11,29 5,29"/><polygon fill="#fff" points="11,16 18,16 27,29 20,29"/><polygon fill="#f6c9b6" points="15,12 22,12 28,3 21,3"/></svg></span>
    <span style="font-weight: 700; font-size: 18px; letter-spacing: -0.01em">Kazi</span>
  </div>

  <form style="background: #30302d; border: 1px solid #3e3d38; border-radius: 20px; padding: 24px 20px; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <h1 style="margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.2">Welcome back</h1>
      <p style="margin: 0; color: #c9c4b8">Sign in to your Kazi.</p>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="dsi-user" style="font-weight: 600; font-size: 14px">Username</label>
      <input id="dsi-user" type="text" autocomplete="username" value="demo" style="height: 50px; box-sizing: border-box; padding: 0 16px; border: 2px solid #ef8460; border-radius: 12px; background: #383733; font: inherit; font-size: 16px; color: #edeae2">
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <div style="display: flex; align-items: baseline; justify-content: space-between">
        <label for="dsi-pass" style="font-weight: 600; font-size: 14px">Password</label>
        <a href="#" style="font-size: 14px; font-weight: 500">Forgot password?</a>
      </div>
      <input id="dsi-pass" type="password" autocomplete="current-password" placeholder="Enter your password" style="height: 50px; box-sizing: border-box; padding: 0 16px; border: 1px solid #8a877c; border-radius: 12px; background: #383733; font: inherit; font-size: 16px; color: #edeae2">
    </div>

    <button type="submit" style="height: 52px; border: 0; border-radius: 999px; background: #a83c1e; color: #fff; font-weight: 600; font-size: 16px">Sign in</button>

    <div role="alert" style="display: flex; gap: 10px; padding: 10px 12px; border-radius: 12px; background: rgba(200,92,63,.22); color: #f0907c; font-size: 14px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 1px"><path d="M12 4l9 16H3zM12 10v4M12 17v.01"/></svg>
      <span>Example of an error: that username and password don't match.</span>
    </div>
  </form>

  <div style="display: flex; flex-direction: column; gap: 4px; align-items: center; text-align: center; background: rgba(48,48,45,.92); border-radius: 14px; padding: 12px">
    <span>Have an invite? <a href="#" style="font-weight: 600">Create your account</a></span>
    <span>Setting up your own server? <a href="#" style="font-weight: 600">Read the setup guide</a></span>
  </div>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
