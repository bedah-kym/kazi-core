name: Nightly eval

permissions:
  contents: read

on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC daily
  workflow_dispatch:

jobs:
  full-pack:
    runs-on: ubuntu-latest

    env:
      DJANGO_SECRET_KEY: ci-test-key-not-for-prod
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      ENCRYPTION_KEY: "I2m1pOTNatH-LkRdlnWXZXqZ9-8oQRm-JCwpwshx6dc="

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      # Enforce the per-capability pack minimum before the full run.
      - name: Eval - scenario pack minimum size
        run: python Backend/manage.py test orchestration.test_scenario_packs --noinput

      # Full pack. Runs the deterministic scenarios always; adds the LLM-backed
      # scenarios only when ANTHROPIC_API_KEY is configured as a repo secret
      # (adding that secret is the explicit human spend approval).
      - name: Eval - full golden pack
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            python Backend/manage.py run_golden_eval --allow-llm
          else
            python Backend/manage.py run_golden_eval
          fi
